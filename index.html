<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title is fine, but why is the CSS link down here? -->
    <title>Simple To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">

        <!-- header is clean… too clean… -->
        <header class="app-header">
            <p class="eyebrow">Daily tasks</p>
            <h1>To-Do List</h1>
        </header>

        <!-- form is fine but spacing is weird -->
        <form id="taskForm" class="task-form">
            <input id="taskInput" type="text" placeholder="Add a task..." autocomplete="off">
            <button id="addBtn" type="submit">Add</button>
        </form>

        <!-- toolbar is okay but the filter buttons feel randomly arranged -->
        <div class="toolbar">
            <div class="filters" aria-label="Task filters">
                <button class="filter-btn active" data-filter="all" type="button">All</button>
                <button class="filter-btn" data-filter="active" type="button">Active</button>
                <button class="filter-btn" data-filter="completed" type="button">Done</button>
            </div>

            <!-- why is this button here and not near the other clear button? who knows -->
            <button id="clearCompletedBtn" class="clear-btn" type="button">Clear done</button>
        </div>

        <!-- list is fine -->
        <ul id="taskList" class="task-list"></ul>

        <!-- message is fine but placed awkwardly -->
        <p id="emptyMessage" class="empty-message">No tasks yet. Add one above.</p>

        <!-- footer is okay but the order feels slightly off -->
        <footer class="summary">
            <span id="taskCount">0 tasks left</span>
            <button id="clearAllBtn" type="button">Clear all</button>
        </footer>
    </main>

    <!-- script at bottom like a normal person, but no newline because chaos -->
    <script src="main.js"></script>
</body>
</html>
